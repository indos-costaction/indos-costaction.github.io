- organization: EBRAINS AISBL
  department: Data & Knowledge
  contact: Lyuba Zehl
  location: Brussels, Belgium
  description: EBRAINS AISBL (Brussels, Belgium) is an international non-profit association coordinating the EBRAINS Research Infrastructure, a distributed pan-European digital infrastructure supporting neuroscience research.
    The EBRAINS AISBL Data & Knowledge Team develops and maintains the openMINDS metadata framework and associated tools, collaborates closely with the EBRAINS Knowledge Graph and Curation Teams, and contributes to international, cross-modality ontology and terminology development.
    We welcome STSM projects related to openMINDS development, ontology and terminology alignment, and neuroscience data curation, including metadata integration, enrichment, and optimisation within the EBRAINS Knowledge Graph, as well as the development of supporting tools and workflows.
- organization: Radboud University
  department: Donders Centre for Cognitive Neuroimaging
  contact: Robert Oostenveld
  location: Nijmegen, The Netherlands
  description: At the Donders we use fMRI, MEG and EEG to study cognition in health and disease, combining cognitive neuroscience with advanced neuroimaging methods.
    As part of our research, we develop open source analysis methods like FieldTrip, BIDScoin and QuIDBBIDS, and share our neuroimaging data in the Radboud Data Repository.
    We welcome STSM projects related to reproducible neuroimaging and open science, for example for researchers looking to convert their own data to BIDS and to share it publicly.
